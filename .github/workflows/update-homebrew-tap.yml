name: Update Homebrew Tap

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 38.0.82)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Tap Repo
        uses: actions/checkout@v4
        with:
          repository: jipika/homebrew-waifux
          token: ${{ secrets.TAP_REPO_TOKEN }}
          path: tap

      - name: Checkout WaifuX source
        uses: actions/checkout@v4
        with:
          repository: jipika/WaifuX
          ref: main
          path: source
          sparse-checkout: |
            packaging/homebrew/waifux.rb.in
            scripts/generate-homebrew-cask.py
          sparse-checkout-cone-mode: false

      - name: Extract Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download DMGs and Compute SHA256
        id: download
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 拆架构分发：arm64 / x86_64 两个 DMG 都要下载并计算 SHA256
          download_dmg() {
            local arch="$1"
            local url="https://github.com/jipika/WaifuX/releases/download/v${VERSION}/WaifuX-${arch}.dmg"
            for i in {1..6}; do
              if curl --fail --silent --show-error --location --retry 2 \
                --output "/tmp/WaifuX-${arch}.dmg" "$url" && \
                test -s "/tmp/WaifuX-${arch}.dmg" && \
                test "$(wc -c < /tmp/WaifuX-${arch}.dmg)" -gt 1048576; then
                return 0
              fi
              echo "attempt $i: WaifuX-${arch}.dmg not ready, retrying in 10s..."
              rm -f "/tmp/WaifuX-${arch}.dmg"
              sleep 10
            done
            echo "❌ Failed to download WaifuX-${arch}.dmg"
            return 1
          }
          download_dmg arm64
          download_dmg x86_64
          sha256_of() {
            python3 -c 'import hashlib, sys; h=hashlib.sha256(); f=open(sys.argv[1], "rb"); [h.update(chunk) for chunk in iter(lambda: f.read(1024 * 1024), b"")]; f.close(); print(h.hexdigest())' "$1"
          }
          SHA256_ARM=$(sha256_of /tmp/WaifuX-arm64.dmg)
          SHA256_INTEL=$(sha256_of /tmp/WaifuX-x86_64.dmg)
          echo "arm64 SHA256: $SHA256_ARM"
          echo "x86_64 SHA256: $SHA256_INTEL"
          echo "sha256-arm=$SHA256_ARM" >> "$GITHUB_OUTPUT"
          echo "sha256-intel=$SHA256_INTEL" >> "$GITHUB_OUTPUT"

      - name: Update Cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256_ARM: ${{ steps.download.outputs.sha256-arm }}
          SHA256_INTEL: ${{ steps.download.outputs.sha256-intel }}
        run: |
          # Render from the canonical WaifuX source template.
          python3 source/scripts/generate-homebrew-cask.py --check
          python3 source/scripts/generate-homebrew-cask.py \
            --version "$VERSION" \
            --sha256-arm "$SHA256_ARM" \
            --sha256-intel "$SHA256_INTEL" \
            --output tap/Casks/waifux.rb
          python3 source/scripts/generate-homebrew-cask.py \
            --check-file tap/Casks/waifux.rb \
            --version "$VERSION" \
            --sha256-arm "$SHA256_ARM" \
            --sha256-intel "$SHA256_INTEL"
          ruby -c tap/Casks/waifux.rb

      - name: Push to Tap Repo
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/waifux.rb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bump waifux to v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

          # Validate the exact file present on the remote branch after push.
          git fetch origin main --depth=1
          git show FETCH_HEAD:Casks/waifux.rb > /tmp/waifux-cask-pushed.rb
          cmp -s Casks/waifux.rb /tmp/waifux-cask-pushed.rb
          python3 ../source/scripts/generate-homebrew-cask.py \
            --check-file /tmp/waifux-cask-pushed.rb \
            --version "${{ steps.version.outputs.version }}" \
            --sha256-arm "${{ steps.download.outputs.sha256-arm }}" \
            --sha256-intel "${{ steps.download.outputs.sha256-intel }}"
          ruby -c /tmp/waifux-cask-pushed.rb
